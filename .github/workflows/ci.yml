name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MCP_HMAC_SECRET: segredo-de-ci
      APP_API_KEY: chave-de-ci
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Rodar testes (pytest)
        run: python -m pytest -q

  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar Bandit (SAST)
        run: pip install bandit

      - name: Analise estatica (nao bloqueia — o server vulneravel e proposital)
        run: bandit -r secure_server client attacks || true
